name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Repo-wide checks that do not depend on the OS or Node version: run once.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: No ignored files are tracked (build output, node_modules)
        run: test -z "$(git ls-files -ci --exclude-standard)"

      # Reads the pnpm version from package.json "packageManager".
      # Node 25+ no longer bundles Corepack, so pnpm is installed by this action.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Generated files are current
        run: pnpm check:generated

  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # ADR-002: macOS and Ubuntu Linux only; Node 24 minimum, also tested on 26.
      # Owner decision (2026-11-09): pull requests run a lighter matrix (Ubuntu on 24 and 26,
      # macOS on 24); pushes to main run the full {ubuntu, macos} x {24, 26} matrix.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","node":24},{"os":"ubuntu-latest","node":26},{"os":"macos-latest","node":24}]' || '[{"os":"ubuntu-latest","node":24},{"os":"ubuntu-latest","node":26},{"os":"macos-latest","node":24},{"os":"macos-latest","node":26}]') }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # Claude Workers on Linux need bubblewrap (#150): without it they refuse to start, so the
      # tests that run the real Claude Code binary need it too.
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap

      # Diagnostics for #150: whether bubblewrap can make the namespaces Claude Code's sandbox uses.
      - name: Check bubblewrap
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          bwrap --version
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone || true
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all true && echo "bwrap sandbox: ok"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
