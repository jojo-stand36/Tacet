name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Repo-wide checks that do not depend on the OS or Node version: run once.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: No ignored files are tracked (build output, node_modules)
        run: test -z "$(git ls-files -ci --exclude-standard)"

      # Reads the pnpm version from package.json "packageManager".
      # Node 25+ no longer bundles Corepack, so pnpm is installed by this action.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Generated files are current
        run: pnpm check:generated
      - name: Repo scripts pass their tests
        run: pnpm check:scripts

  # Fails once an active vendor surface was last checked more than 30 days ago (#66), and warns a
  # week before. It goes red with time, not with the change, so it is a job of its own: do not
  # make it a required check. Refresh as "Keeping it fresh" in docs/adapters/capability-matrix.md
  # says.
  matrix-freshness:
    name: matrix-freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Capability matrix is fresh
        run: node scripts/check-matrix-freshness.mjs

  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # ADR-002: macOS and Ubuntu; WSL2 CI tracked in #193; Node 24 minimum, also tested on 26.
      # Owner decision (2026-11-09): pull requests run a lighter matrix (Ubuntu on 24 and 26,
      # macOS on 24); pushes to main run the full {ubuntu, macos} x {24, 26} matrix.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","node":24},{"os":"ubuntu-latest","node":26},{"os":"macos-latest","node":24}]' || '[{"os":"ubuntu-latest","node":24},{"os":"ubuntu-latest","node":26},{"os":"macos-latest","node":24},{"os":"macos-latest","node":26}]') }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
